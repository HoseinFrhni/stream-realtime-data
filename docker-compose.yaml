# ============================================================================
# Streaming Data Pipeline - Docker Compose
# ============================================================================
# راه‌اندازی کامل خودکار:
#   docker compose up -d
#
# پس از اجرا، این‌ها خودکار انجام می‌شوند:
#   - ClickHouse با جداول Bronze/Silver/Gold راه‌اندازی می‌شود
#   - Kafka Broker بالا می‌آید
#   - تاپیک wiki-events خودکار ساخته می‌شود
#   - Kafka UI راه‌اندازی می‌شود
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # ClickHouse - مصرف‌کننده‌ی جریان داده
  # --------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    container_name: clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native TCP interface
    environment:
      CLICKHOUSE_DB: tutorial
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
    volumes:
      - clickhouse-volume:/var/lib/clickhouse
      # اسکریپت‌ها در اولین اجرا به ترتیب الفبا اجرا می‌شوند
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - services
    depends_on:
      kafka-broker:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Kafka Broker - حالت KRaft (بدون Zookeeper)
  # --------------------------------------------------------------------------
  kafka-broker:
    image: apache/kafka:3.9.0
    container_name: kafka-broker
    hostname: kafka-broker
    ports:
      - "9092:9092"    # External
      - "29092:29092"  # Internal
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: localhost
    volumes:
      - kafka-volume:/var/lib/kafka/data
    networks:
      - services
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Kafka Init - ساخت خودکار تاپیک wiki-events
  # --------------------------------------------------------------------------
  # این سرویس فقط یک بار اجرا می‌شود و پس از ساخت تاپیک، خاتمه می‌یابد.
  # اگر تاپیک از قبل وجود داشته باشد، دوباره ساخته نمی‌شود.
  # --------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      kafka-broker:
        condition: service_healthy
    networks:
      - services
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Kafka to be ready..."
        sleep 3
        echo "Creating topic 'wiki-events' (if not exists)..."
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-broker:29092 \
          --create --if-not-exists \
          --topic wiki-events \
          --partitions 3 \
          --replication-factor 1
        echo "Topic 'wiki-events' is ready."
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-broker:29092 \
          --describe --topic wiki-events
    restart: "no"

  # --------------------------------------------------------------------------
  # Kafka UI - رابط کاربری وب
  # --------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:29092
    networks:
      - services
    depends_on:
      kafka-broker:
        condition: service_healthy
    restart: unless-stopped

    # --------------------------------------------------------------------------
  # Metabase - ابزار مصورسازی و BI
  # --------------------------------------------------------------------------
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    hostname: metabase
    ports:
      - "3000:3000"
    environment:
      # استفاده از H2 به عنوان دیتابیس داخلی Metabase (برای شروع سریع)
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_OPTS: "-Xmx1g"
    volumes:
      - metabase-data:/metabase-data
      - ./metabase-plugins:/plugins  # پوشه‌ی درایور ClickHouse
    networks:
      - services
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
volumes:
  clickhouse-volume:
  kafka-volume:
  metabase-data:  # ← این خط را اضافه کنید

networks:
  services:
    name: stream-realtime-data_services   # ← نام جدید (به جای service_network)
    driver: bridge