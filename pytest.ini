[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=producer
    --cov-report=term-missing
    --cov-report=html:htmlcov
markers =
    unit: Unit tests (fast, no external deps)
    integration: Integration tests (require Docker services)
    slow: Slow tests